name: montageplanung-deploy
on:
  push:
    branches: [main]
    paths: ['apps/montageplanung/**', '.github/workflows/montageplanung-deploy.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/montageplanung
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/montageplanung/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/montageplanung/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/patch-wrangler-config.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: de81ba1a2e7bae6a87821b398353b8dd
          workingDirectory: apps/montageplanung
          command: deploy --config dist/server/wrangler.json
