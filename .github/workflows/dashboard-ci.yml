name: dashboard-ci
on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
      - 'apps/montageplanung/db/schema.ts'
      - 'apps/montageplanung/drizzle/**'
      - 'apps/aufmass/db/schema.ts'
      - 'apps/aufmass/drizzle/**'
      - 'apps/aufmass/lib/types.ts'
      - 'apps/aufmass/lib/business.ts'
      - 'apps/aufmass/lib/employees.ts'
      - 'apps/aufmass/lib/report-crews.ts'
      - 'apps/aufmass/lib/time-reports.ts'
      - 'apps/aufmass/lib/ids.ts'
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
      - 'apps/montageplanung/db/schema.ts'
      - 'apps/montageplanung/drizzle/**'
      - 'apps/aufmass/db/schema.ts'
      - 'apps/aufmass/drizzle/**'
      - 'apps/aufmass/lib/types.ts'
      - 'apps/aufmass/lib/business.ts'
      - 'apps/aufmass/lib/employees.ts'
      - 'apps/aufmass/lib/report-crews.ts'
      - 'apps/aufmass/lib/time-reports.ts'
      - 'apps/aufmass/lib/ids.ts'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
