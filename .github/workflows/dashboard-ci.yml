name: dashboard-ci
on:
  push:
    branches: [main]
    paths: ['apps/dashboard/**', '.github/workflows/dashboard-ci.yml']
  pull_request:
    paths: ['apps/dashboard/**', '.github/workflows/dashboard-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
